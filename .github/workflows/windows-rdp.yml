name: Windows Cloud RDP
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360
    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "Cynet@2026" -AsPlainText -Force
          New-LocalUser -Name "Sepahan-Pc" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "Sepahan-Pc" -ErrorAction SilentlyContinue
          net user runneradmin Cynet@2026

      - name: 3. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"
          Start-Sleep -Seconds 8
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          Write-Host ""
          Write-Host "==================================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : Sepahan-Pc" -ForegroundColor Yellow
          Write-Host "  Password     : Cynet@2026" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==================================================" -ForegroundColor Green

      - name: 4. Install and configure 3x-ui + Hysteria2
        run: |
          New-Item -ItemType Directory -Path "C:\x-ui" -Force
          Invoke-WebRequest "https://github.com/MHSanaei/3x-ui/releases/latest/download/x-ui-windows-amd64.zip" -OutFile "C:\x-ui.zip"
          Expand-Archive -Path "C:\x-ui.zip" -DestinationPath "C:\x-ui" -Force

          cd C:\x-ui\x-ui

          # Generate self-signed cert
          & openssl req -x509 -nodes -newkey rsa:2048 -keyout key.pem -out cert.pem -days 365 -subj "/CN=localhost" -extensions v3_req

          # Set panel credentials + explicit panel port
          .\x-ui.exe setting -username admin -password admin -port 2053

          # Apply the cert to the panel automatically
          .\x-ui.exe cert -webCert "C:/x-ui/x-ui/cert.pem" -webCertKey "C:/x-ui/x-ui/key.pem"

          # Start x-ui in the background
          Start-Process -FilePath ".\x-ui.exe" -WorkingDirectory "C:\x-ui\x-ui" -WindowStyle Hidden

          Start-Sleep -Seconds 5
          Write-Host "3x-ui panel should now be running HTTPS on port 2053"
          Write-Host "Cert path: C:/x-ui/x-ui/cert.pem"
          Write-Host "Key path:  C:/x-ui/x-ui/key.pem"

      - name: 5. Open Hysteria2 UDP port
        run: |
          New-NetFirewallRule -DisplayName "3x-ui Hysteria2" -Direction Inbound -Protocol UDP -LocalPort 443
