      - name: 4. Install and configure 3x-ui + Hysteria2
        run: |
          New-Item -ItemType Directory -Path "C:\x-ui" -Force
          Invoke-WebRequest "https://github.com/MHSanaei/3x-ui/releases/latest/download/x-ui-windows-amd64.zip" -OutFile "C:\x-ui.zip"
          Expand-Archive -Path "C:\x-ui.zip" -DestinationPath "C:\x-ui" -Force

          # Find x-ui.exe wherever the zip put it
          $exe = Get-ChildItem -Path "C:\x-ui" -Recurse -Filter "x-ui.exe" | Select-Object -First 1
          if (-not $exe) {
            Write-Host "x-ui.exe not found, folder contents:"
            Get-ChildItem -Path "C:\x-ui" -Recurse | Select-Object FullName
            exit 1
          }
          $dir = $exe.DirectoryName
          Set-Location $dir
          Write-Host "Found x-ui in: $dir"

          # Generate self-signed cert
          & openssl req -x509 -nodes -newkey rsa:2048 -keyout key.pem -out cert.pem -days 365 -subj "/CN=localhost" -extensions v3_req

          $certPath = ($dir -replace '\\','/') + "/cert.pem"
          $keyPath  = ($dir -replace '\\','/') + "/key.pem"

          # Panel credentials + port
          .\x-ui.exe setting -username admin -password admin -port 2053

          # Apply the cert to the panel
          .\x-ui.exe cert -webCert $certPath -webCertKey $keyPath

          # Start x-ui in the background
          Start-Process -FilePath ".\x-ui.exe" -WorkingDirectory $dir -WindowStyle Hidden

          Start-Sleep -Seconds 5
          Write-Host "3x-ui panel should now be running HTTPS on port 2053"
          Write-Host "Cert path: $certPath"
          Write-Host "Key path:  $keyPath"
